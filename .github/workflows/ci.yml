# What `npm run check` runs locally (docs/CI.md).
name: CI

on:
  pull_request: # every PR, whatever the target branch
  # deploy.yml runs this first on every commit to main and publishes only those that pass.
  workflow_call:

# A new push to the branch cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the repository only.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway Postgres + Redis, like docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v7 # download the repository
      - uses: actions/setup-node@v7 # install Node (version from .nvmrc)
        with:
          node-version-file: .nvmrc
          cache: npm # reuse downloaded packages between runs
      - run: npm ci # clean install from package-lock.json
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # unit + integration (uses the service containers)
      - run: npm run monitoring:check # Prometheus configuration, with its own promtool
      # Catches what typecheck can't, like a page needing the API at build time.
      # NEXT_TELEMETRY_DISABLED: no usage pings.
      - run: npm run build -w @portfolio/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Build both images for the server's Arm CPU (DESIGN.md §14.2), so a broken Dockerfile fails
  # the PR, not the deploy. Nothing is pushed here: deploy.yml does that after CI passes.
  images:
    name: image (${{ matrix.image }})
    # GitHub's Arm runners: native arm64 builds, no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false # a broken API image should not hide the state of the web image
      matrix:
        image: [api, web]

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4 # BuildKit, which the cache below needs
      # The API image downloads this month's GeoIP files; the month is in the cache key.
      - id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          push: false
          # API only (the web image would warn about an unused argument).
          build-args: ${{ matrix.image == 'api' && format('GEOIP_MONTH={0}', steps.month.outputs.value) || '' }}
          # Layers cached in GitHub Actions per image; mode=max keeps intermediate stages too.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
