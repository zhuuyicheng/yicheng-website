# Runs exactly what `npm run check` runs locally. Guide: docs/CI.md
name: CI

on:
  pull_request: # every PR, whatever the target branch
  # Every commit that lands on main: the deploy workflow (deploy.yml) runs this first and
  # publishes only commits that pass (Phase 6c).
  workflow_call:

# A new push to the same branch cancels the previous, now outdated, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable Postgres + Redis containers, the CI equivalent of docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v7 # download the repository
      - uses: actions/setup-node@v7 # install Node (version from .nvmrc)
        with:
          node-version-file: .nvmrc
          cache: npm # reuse downloaded packages between runs
      - run: npm ci # clean install from package-lock.json
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # unit + integration (uses the service containers)
      # The site's production build (Phase 5): catches what typecheck cannot, such as a page
      # that would need the API while building. NEXT_TELEMETRY_DISABLED: no usage pings.
      - run: npm run build -w @portfolio/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Phase 6a: build both Docker images for the production server's Arm CPU (DESIGN.md §14.2),
  # so a broken Dockerfile fails the PR instead of the deploy. Nothing is pushed here: on main,
  # deploy.yml's publish job pushes them once this whole workflow has passed (6c).
  images:
    name: image (${{ matrix.image }})
    # GitHub's Arm machines (free for public repositories): native arm64 builds, no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false # a broken API image should not hide the state of the web image
      matrix:
        image: [api, web]

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4 # BuildKit, which the cache below needs
      # The API image downloads this month's GeoIP files; the month is part of the cache key.
      - id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          push: false
          # Only the API image has this argument (the web image would warn about an unused one).
          build-args: ${{ matrix.image == 'api' && format('GEOIP_MONTH={0}', steps.month.outputs.value) || '' }}
          # Layers are kept in GitHub's Actions cache between runs (one scope per image);
          # mode=max keeps the intermediate stages too (dependencies, GeoIP download).
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
