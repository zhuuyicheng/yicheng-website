<!doctype html>
<!--
  What visitors see while the site is paused (docs/CD.md §5). Caddy serves this file by itself,
  so it needs nothing else: styles and icon are inline, and it works even when the app is down.
  Colours are the site's (apps/web/src/app/globals.css). The LinkedIn link repeats the one in
  apps/api/content/portfolio.json: change both together.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back soon · Zhu Yicheng</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c2410c'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23faf7f2'%3EYC%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: #faf7f2;
        color: #463f37;
        font:
          17px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 30rem;
        text-align: center;
      }
      svg {
        display: block;
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
      }
      .name {
        margin: 0;
        color: #6b6259;
        font-size: 0.8125rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        margin: 4px 0 12px;
        color: #1f1a15;
        font:
          600 2.5rem/1.15 ui-serif,
          Georgia,
          'Times New Roman',
          serif;
      }
      p {
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 999px;
        background: #c2410c;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #9a3412;
      }
      a:focus-visible {
        outline: 2px solid #9a3412;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#c2410c" />
        <text
          x="32"
          y="43"
          text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="30"
          font-weight="700"
          fill="#faf7f2"
        >
          YC
        </text>
      </svg>
      <p class="name">Zhu Yicheng</p>
      <h1>Back soon</h1>
      <p>This site is taking a short break. Please check back in a little while.</p>
      <a href="https://www.linkedin.com/in/yichengzhu01">Find me on LinkedIn</a>
    </main>
  </body>
</html>
