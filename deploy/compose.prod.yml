# The production stack (DESIGN.md §14.5, docs/PRODUCTION-STACK.md), on the server or your laptop:
#   Caddy (HTTPS, routing) → api-1 + api-2 and web; worker; Postgres; Redis
#   monitoring (§15): Prometheus, node-exporter, Alertmanager, Grafana (https://<host>/grafana)
# Values come from deploy/.env next to this file. Images default to the ones built locally;
# deploy/deploy.sh sets API_IMAGE and WEB_IMAGE (docs/CD.md). From the repository root:
#   docker compose -f deploy/compose.prod.yml run --rm migrate     apply migrations
#   docker compose -f deploy/compose.prod.yml run --rm seed        publish the content
#   docker compose -f deploy/compose.prod.yml up -d --wait         start (waits for healthy)
#   docker compose -f deploy/compose.prod.yml run --rm replay-dlq telemetry
# Its own project name and volumes, so it never touches the dev datastores.
name: portfolio-prod

# Shared pieces: "x-" blocks are ignored by Compose; `<<: *name` copies one in.

# Docker keeps container logs forever by default, which fills a small disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Everything running the API image: replicas, worker and tools. Each container gets only the
# variables it needs. `:?` stops Compose with that message when a value is missing.
x-api-image: &api-image
  image: ${API_IMAGE:-portfolio-api:dev}
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-portfolio}
    REDIS_URL: redis://redis:6379/0
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Caddy sets X-Forwarded-For to the visitor's address (never taken from the visitor).
    TRUST_PROXY: 'true'
    CORS_ORIGINS: https://${SITE_HOST:?set SITE_HOST in deploy/.env}
    IP_HASH_SECRET: ${IP_HASH_SECRET:?set IP_HASH_SECRET in deploy/.env}
    METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in deploy/.env}
    ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in deploy/.env}
    NOTIFIER_DRIVER: ${NOTIFIER_DRIVER:-discord}
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging

# Healthy = /health (Postgres and Redis answer), so `up --wait` means ready to serve. No curl
# in the image, so Node makes the request.
x-api-replica: &api-replica
  <<: *api-image
  restart: unless-stopped
  # SIGTERM, then a kill after this; longer than the API's own 10 s shutdown deadline.
  stop_grace_period: 15s
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - 'fetch("http://127.0.0.1:4000/health").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
    start_interval: 2s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    # No `ports`: only this network reaches the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # As in development (DESIGN.md §6.3): AOF, and volatile-lru so queued work is never evicted.
    command:
      [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, volatile-lru]
    # No `ports` and no password: only this network reaches it.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s
    logging: *logging

  # Two services, so a deploy can replace one while the other serves (DESIGN.md §14.5).
  # `hostname` is the name the /admin dashboard shows.
  api-1:
    <<: *api-replica
    hostname: api-1

  api-2:
    <<: *api-replica
    hostname: api-2

  # One worker only (DESIGN.md §8.4): the deploy stops the old one first.
  worker:
    <<: *api-image
    command: [node, dist/worker.js]
    restart: unless-stopped
    stop_grace_period: 15s

  web:
    image: ${WEB_IMAGE:-portfolio-web:dev}
    restart: unless-stopped
    environment:
      # Caddy's internal listener, so the server's API calls are load balanced too.
      API_BASE_URL: http://caddy:8080
      # Except the dashboard's: it asks each replica, since each counts only its own requests
      # (DESIGN.md §8.6). Keep in step with the api-N services.
      API_REPLICA_URLS: http://api-1:4000,http://api-2:4000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in deploy/.env}
    healthcheck:
      # A static file, so it checks the web server alone.
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/icon.svg").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in deploy/.env}
    # The only published ports: 80 (Let's Encrypt, then a redirect), 443 and 443/udp (HTTP/3).
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # The folder, not the file: a mounted file keeps its version from container start, so
      # `caddy reload` would miss edits. Only this folder (deploy/.env stays out); it also holds
      # back-soon.html and, while paused, `paused`.
      - ./caddy:/etc/caddy:ro
      # Certificates: keep this volume, or Let's Encrypt's weekly limit gets hit.
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Reads every process's /metrics every 15 s and keeps 30 days (DESIGN.md §15). No `ports`:
  # only this network reaches it. See prometheus/prometheus.yml.
  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 days, or fewer if 2 GB fills first (expected: well under 1 GB).
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    secrets: [metrics_token]
    volumes:
      # The folder, not the file (as for Caddy), so a reload sees edits.
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, promtool, check, ready, --url=http://127.0.0.1:9090]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  # The VM's CPU, memory and disk. `pid: host` and the read-only `/` show the host's
  # processes and filesystems instead of the container's.
  node-exporter:
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      # Only what the dashboard and the alerts use.
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.uname
      # Docker Desktop (your computers) lists some of these twice: an error on every scrape.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|mnt|parent-distro|var/lib/docker/.+)($$|/)
      # *.prom files in /textfile: backup.sh's success time (record-backup-time below).
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro
      - backup-metrics:/textfile:ro
    logging: *logging

  # Turns firing alerts into Discord messages (DESIGN.md §15.3). NOTIFIER_DRIVER picks the file,
  # as it picks the API's notifier: alertmanager/discord.yml posts, log.yml sends nothing.
  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/${NOTIFIER_DRIVER:-discord}.yml
      - --storage.path=/alertmanager
      # A single Alertmanager: no peers to gossip with.
      - --cluster.listen-address=
    secrets: [discord_webhook_url]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # Silences, and what was already sent, survive a restart.
      - alertmanager-data:/alertmanager
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9093/-/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  # Dashboards at https://<host>/grafana (DESIGN.md §15.4). Anyone can reach its login page, so:
  # one admin account, sign-up and guests off, 5 wrong passwords lock it for 5 minutes (Grafana's
  # default), secure cookies, nothing sent to grafana.com. Its only data source is Prometheus.
  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${SITE_HOST:?set SITE_HOST in deploy/.env}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      # Read only when Grafana first creates its database; to change it later, see
      # docs/PRODUCTION-STACK.md §7 (grafana cli admin reset-admin-password).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      # Opens on the dashboard after login.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/portfolio.json
    volumes:
      # Only these two provisioning folders: Grafana expects its other (empty) ones to exist.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Its own database: the admin account and sessions. The dashboard comes from Git.
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3000/grafana/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging: *logging

  # Tools (DESIGN.md §14.3): the `tools` profile keeps `up` from starting them;
  # `docker compose run --rm <name>` runs one.
  migrate:
    <<: *api-image
    entrypoint: [node, dist/cli/migrate.js]
    profiles: [tools]

  seed:
    <<: *api-image
    entrypoint: [node, dist/cli/seed-content.js]
    profiles: [tools]

  replay-dlq:
    <<: *api-image
    entrypoint: [node, dist/cli/replay-dlq.js]
    profiles: [tools]

  # backup.sh's last step: `run --rm record-backup-time <unix time>` writes the success time for
  # node-exporter (the BackupStale alert). Its image for the shell; root, as the volume is root's.
  record-backup-time:
    image: prom/node-exporter:v1.13.1
    user: root
    entrypoint:
      - sh
      - -c
      - |
        printf '%s\n' \
          '# HELP portfolio_backup_last_success_timestamp_seconds When backup.sh last finished a tested backup.' \
          '# TYPE portfolio_backup_last_success_timestamp_seconds gauge' \
          "portfolio_backup_last_success_timestamp_seconds $$1" >/textfile/.backup.prom.tmp
        mv /textfile/.backup.prom.tmp /textfile/backup.prom
      - record-backup-time
    volumes:
      - backup-metrics:/textfile
    profiles: [tools]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  backup-metrics:
  grafana-data:

secrets:
  # deploy/.env's values as files in /run/secrets/: never in Git, an image, or `docker inspect`.
  metrics_token:
    environment: METRICS_TOKEN
  discord_webhook_url:
    environment: DISCORD_WEBHOOK_URL
