# Unit tests for alerts.yml (DESIGN.md §15.3): promtool feeds made-up samples, then checks
# which alerts fire at a given time, with which labels and text. npm run monitoring:check runs
# them. A sample's notation: `1+2x3` is 1, 3, 5, 7; `0x3` is 0, 0, 0, 0.

rule_files:
  - alerts.yml

evaluation_interval: 15s

tests:
  - name: a target that stops answering alerts after 2 minutes, not during a restart
    interval: 15s
    input_series:
      - series: up{job="api", instance="api-1"}
        values: 1 1 0x16 # down from 30 s on
      - series: up{job="api", instance="api-2"}
        values: 1x18
    alert_rule_test:
      - eval_time: 1m30s # down for a minute, as in a deploy: nothing yet
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: { job: api, instance: api-1 }
            exp_annotations:
              summary: api-1 has not answered Prometheus for 2 minutes.
              description: 'Stopped, restarting, or refusing the metrics token: $C ps shows which, $C logs <name> says why.'

  - name: visitor errors over 5 % alert after 10 minutes
    interval: 15s
    input_series: # 10 % of visitor requests fail: 90 answered, 10 failed every 15 s
      - series: http_requests_total{job="api", instance="api-1", method="GET", route="/api/v1/projects", status_code="200"}
        values: 0+90x80
      - series: http_requests_total{job="api", instance="api-1", method="GET", route="/api/v1/projects", status_code="500"}
        values: 0+10x80
    alert_rule_test:
      - eval_time: 8m
        alertname: ApiErrors
        exp_alerts: []
      - eval_time: 15m
        alertname: ApiErrors
        exp_alerts:
          - exp_annotations:
              summary: 10% of visitor requests failed (5xx) over the last 5 minutes.
              description: "Each one is in the API's log with its cause: $C logs api-1 api-2 | grep 'request failed'."

  - name: a failing health check is not a visitor error
    interval: 15s
    input_series: # /health answers 503 (Redis down), visitors are served fine
      - series: http_requests_total{job="api", instance="api-1", method="GET", route="/api/v1/projects", status_code="200"}
        values: 0+90x80
      - series: http_requests_total{job="api", instance="api-1", method="GET", route="/health", status_code="503"}
        values: 0+50x80
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiErrors
        exp_alerts: []

  - name: slow visitor requests alert after 10 minutes
    interval: 15s
    input_series: # every request took between 0.5 and 1 s
      - series: http_request_duration_seconds_bucket{job="api", instance="api-1", route="/api/v1/projects", le="0.5"}
        values: 0x80
      - series: http_request_duration_seconds_bucket{job="api", instance="api-1", route="/api/v1/projects", le="1"}
        values: 0+100x80
      - series: http_request_duration_seconds_bucket{job="api", instance="api-1", route="/api/v1/projects", le="+Inf"}
        values: 0+100x80
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiSlow
        exp_alerts:
          - exp_annotations:
              summary: 'Visitor requests are slow: p95 975ms over the last 5 minutes.'
              description: 'Usually a slow database or a busy server: /admin shows the dependencies, docker stats --no-stream the load.'

  - name: dead letters alert once per queue, though both replicas report them
    interval: 15s
    input_series:
      - series: queue_depth{job="api", instance="api-1", queue="telemetry_dlq"}
        values: 0 0 2x40
      - series: queue_depth{job="api", instance="api-2", queue="telemetry_dlq"}
        values: 0 0 2x40
      - series: queue_depth{job="api", instance="api-1", queue="notifications_dlq"}
        values: 0x42
    alert_rule_test:
      - eval_time: 3m
        alertname: DeadLetters
        exp_alerts: []
      - eval_time: 8m
        alertname: DeadLetters
        exp_alerts:
          - exp_labels: { queue: telemetry_dlq }
            exp_annotations:
              summary: telemetry_dlq holds 2 item(s) that failed for good.
              description: '/admin, Queues, Show items says why. Fix that, then retry them: $C run --rm replay-dlq telemetry (or notifications).'

  - name: events waiting while the worker saves none alert after 10 minutes
    interval: 15s
    input_series:
      - series: queue_depth{job="api", instance="api-1", queue="telemetry_buffer"}
        values: 3x120
      - series: telemetry_events_flushed_total{job="worker", instance="worker"}
        values: 50x120 # never grows
    alert_rule_test:
      - eval_time: 25m
        alertname: TelemetryStuck
        exp_alerts:
          - exp_annotations:
              summary: 3 visit event(s) wait in Redis, and the worker has saved none for 20 minutes.
              description: 'The worker runs but cannot save them: $C logs worker shows why.'

  - name: a busy buffer that the worker keeps saving is fine
    interval: 15s
    input_series:
      - series: queue_depth{job="api", instance="api-1", queue="telemetry_buffer"}
        values: 3x120
      - series: telemetry_events_flushed_total{job="worker", instance="worker"}
        values: 50+5x120
    alert_rule_test:
      - eval_time: 25m
        alertname: TelemetryStuck
        exp_alerts: []

  - name: worker loops failing again and again alert
    interval: 15s
    input_series: # the flusher never failed, so its counter has no series at all
      - series: worker_loop_failures_total{job="worker", instance="worker", loop="notification-promoter", kind="transient"}
        values: 0+1x80 # one failure every 15 s: Redis is down
    alert_rule_test:
      - eval_time: 3m
        alertname: WorkerFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: WorkerFailing
        exp_alerts:
          - exp_annotations:
              summary: "The worker's loops failed 40 times in 10 minutes."
              description: 'A datastore not answering, or a bug: $C logs worker shows each failure.'

  - name: one failed flush is no alert
    interval: 15s
    input_series:
      - series: telemetry_flush_failures_total{job="worker", instance="worker", kind="transient"}
        values: 0 1x80
    alert_rule_test:
      - eval_time: 6m # the failure is still in the 10-minute window, and 5 minutes have passed
        alertname: WorkerFailing
        exp_alerts: []

  - name: the VM's disk and memory alert when nearly full
    interval: 15s
    input_series:
      - series: node_filesystem_avail_bytes{job="node", instance="node-exporter", mountpoint="/"}
        values: 10x60
      - series: node_filesystem_size_bytes{job="node", instance="node-exporter", mountpoint="/"}
        values: 100x60
      - series: node_memory_MemAvailable_bytes{job="node", instance="node-exporter"}
        values: 10x60
      - series: node_memory_MemTotal_bytes{job="node", instance="node-exporter"}
        values: 100x60
    alert_rule_test:
      - eval_time: 12m
        alertname: DiskFilling
        exp_alerts:
          - exp_labels: { job: node, instance: node-exporter, mountpoint: / }
            exp_annotations:
              summary: "The server's disk has 10% free."
              description: 'docker system df shows what Docker uses (images, logs); du -sh ~/backups the backups.'
      - eval_time: 12m
        alertname: MemoryHigh
        exp_alerts:
          - exp_labels: { job: node, instance: node-exporter }
            exp_annotations:
              summary: "The server's memory is 90% used."
              description: 'docker stats --no-stream shows which container uses it.'

  - name: a backup older than 8 days alerts
    interval: 15s
    input_series: # promtool's clock starts at 0, so "9 days before" is a negative time
      - series: portfolio_backup_last_success_timestamp_seconds{job="node", instance="node-exporter"}
        values: -777600x8
    alert_rule_test:
      - eval_time: 1m
        alertname: BackupStale
        exp_alerts:
          - exp_annotations:
              summary: 'The last good backup is 9d 0h 1m 0s old; one a week is expected.'
              description: 'Is the cron job still there (crontab -l)? Its log: ~/backups/backup.log. Or run one by hand: bash ~/portfolio/deploy/backup.sh'

  - name: a weekly backup is fine
    interval: 15s
    input_series: # 7 days before the clock starts
      - series: portfolio_backup_last_success_timestamp_seconds{job="node", instance="node-exporter"}
        values: -604800x8
    alert_rule_test:
      - eval_time: 1m
        alertname: BackupStale
        exp_alerts: []
